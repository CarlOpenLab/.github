name: Bug report
description: Report something that does not work as documented
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please search the existing issues first —
        adding detail to an open issue is more useful than opening a duplicate.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (see SECURITY.md for how to report those)
          required: true

  - type: input
    id: package
    attributes:
      label: Package or project
      description: Which repository, or which npm package, is affected?
      placeholder: "@cc-heart/utils-client"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The exact version you tested. Include the runtime version too if it matters.
      placeholder: "2.1.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction is the single most useful thing you can provide.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Node: 20.11.0
        Package manager: pnpm 9
        OS: macOS 15.0
        Browser: Chrome 130 (if relevant)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste text rather than screenshots so it can be searched and copied.
      render: shell
    validations:
      required: false
